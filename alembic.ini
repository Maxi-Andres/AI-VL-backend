# Alembic config for the gateway's database. The app runs `upgrade head` on startup
# (db.migrate), which overrides script_location and sqlalchemy.url from db.py; this file
# exists for the CLI, e.g. `alembic revision -m "add sites"` from this directory.
[alembic]
script_location = migrations
# Filled in by migrations/env.py from db.DATABASE_URL; never put a URL with a password here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
