name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"     # the floor this tier commits to (see ruff.toml)
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pip-audit
      - name: Lint
        run: ruff check --output-format=github
      - name: Test
        # exit 5 = "no tests collected". A repo without a suite yet must not fail CI; a repo
        # whose suite breaks must. Mirrors the pre-commit gate exactly.
        run: |
          pytest -q; rc=$?
          [ $rc -eq 5 ] && exit 0
          exit $rc
      - name: Dependency audit
        run: pip-audit --strict --desc || true   # advisory: a new CVE must not block a hotfix
