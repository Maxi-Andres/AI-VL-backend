# Commit gate. Fast checks only: if this takes more than a couple of seconds people start
# using --no-verify, and a gate that gets bypassed is worse than no gate.
# The full suite and the dependency audit run in CI (.github/workflows/ci.yml).
#
# Setup on a new machine:  pre-commit install
# Run over everything:     pre-commit run --all-files
fail_fast: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key        # a token in a diff has already happened here once
      - id: check-added-large-files
        args: ["--maxkb=512"]         # model weights and media do not belong in git

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: ruff check --force-exclude
        language: system
        types: [python]
        require_serial: false
      - id: pytest
        name: pytest
        # exit 5 = "no tests collected". A repo that has no suite YET must not be blocked;
        # a repo whose suite breaks must be. Everything else propagates.
        entry: bash -c '.venv/bin/python -m pytest -q; rc=$?; [ $rc -eq 5 ] && exit 0; exit $rc'
        language: system
        pass_filenames: false
        always_run: true
